<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Petal Drop — a flower merging game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root{--ink:#4a3d48;--muted:#8d7f8a;--accent:#d9708f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overscroll-behavior:none;overflow:hidden}
  body{
    font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);touch-action:none;
    background:radial-gradient(circle at 15% 0%,#fff7fb 0,transparent 55%),linear-gradient(170deg,#fbe9ef,#e8f0dd);
    display:flex;flex-direction:column;align-items:center;padding:12px 10px;
  }
  .wrap{width:var(--gw)}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  h1{margin:0;font-weight:600;font-size:clamp(24px,5vw,38px);line-height:1}
  h1 span{color:var(--accent)}
  .stats{display:flex;gap:6px;align-items:stretch}
  .box{background:#fffcfdcc;border-radius:14px;padding:5px 12px;text-align:center;min-width:64px;box-shadow:0 2px 0 #0000000d}
  .box small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .box b{font-size:clamp(17px,3.2vw,22px);font-weight:600}
  .next{display:flex;align-items:center;justify-content:center;font-size:clamp(20px,4vw,28px);line-height:1.1}
  .stage{position:relative;width:var(--gw);height:calc(var(--gw) * 4 / 3)}
  canvas{display:block;width:100%;height:100%;border-radius:0 0 34px 34px}
  .overlay{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:#fff8fae8;border-radius:0 0 34px 34px;text-align:center;padding:20px;
  }
  .overlay.show{display:flex;animation:fade .35s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay .big{font-size:clamp(60px,13vw,96px)}
  .overlay h2{margin:0;font-size:clamp(28px,6vw,42px);font-weight:600}
  .overlay p{margin:0;color:var(--muted);font-size:clamp(15px,2.8vw,20px)}
  button{
    font:inherit;font-weight:500;font-size:clamp(15px,2.8vw,19px);border:0;border-radius:14px;padding:10px 20px;
    background:var(--accent);color:#fff;box-shadow:0 3px 0 #b35472;cursor:pointer
  }
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #b35472}
  .ladder{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:#fffcfdaa;border-radius:16px;padding:6px 8px}
  .ladder div{font-size:clamp(15px,3.2vw,24px);opacity:.25;transition:opacity .3s}
  .ladder div.seen{opacity:1}
  .hint{text-align:center;color:var(--muted);font-size:clamp(12px,2.2vw,15px);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Petal <span>Drop</span></h1>
    <div class="stats">
      <div class="box"><small>Next</small><div class="next" id="next">🌱</div></div>
      <div class="box"><small>Score</small><b id="score">0</b></div>
      <div class="box"><small>Best</small><b id="best">0</b></div>
    </div>
  </header>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="over">
      <div class="big" id="ovIcon">🥀</div>
      <h2 id="ovTitle">The vase overflowed!</h2>
      <p id="ovText">Score: 0</p>
      <button id="again">Pick a new bunch</button>
    </div>
    <div class="overlay" id="loadErr">
      <div class="big">🌧️</div>
      <h2>Couldn't load the game</h2>
      <p>Check your connection and reopen the page.</p>
    </div>
  </div>
  <div class="ladder" id="ladder"></div>
  <div class="hint">Slide your finger to aim, lift to drop. Two matching flowers bloom into the next one!</div>
</div>

<script>
(function(){
  if(!window.Matter){ document.getElementById('loadErr').classList.add('show'); return; }
  const {Engine, Bodies, Composite, Body, Events} = Matter;

  const W = 600, H = 800, LINE = 130, HOLD_Y = 62, WALL = 60;
  const F = [null,
    {e:'🌱',c:'#cfe8b0',r:22},
    {e:'🍀',c:'#a8dca0',r:30},
    {e:'🌼',c:'#fde58a',r:40},
    {e:'🌷',c:'#f8b8c8',r:50},
    {e:'🌸',c:'#fbcfe3',r:61},
    {e:'🌺',c:'#f59aae',r:73},
    {e:'🌻',c:'#ffd166',r:86},
    {e:'🌹',c:'#ec7f92',r:100},
    {e:'🪷',c:'#e0b6ef',r:115},
    {e:'💐',c:'#c9e4f7',r:131},
    {e:'🌳',c:'#9fd28f',r:148}
  ];
  const MAX = F.length - 1;
  const POINTS = [0,1,3,6,10,15,21,28,36,45,55,66];

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const nextEl = document.getElementById('next'), over = document.getElementById('over');
  const ladderEl = document.getElementById('ladder');

  function load(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  let best = load('petal-best',0), seen = load('petal-seen',1);

  let scale = 1, dpr = 1, sprites = [];
  function resize(){
    const gw = Math.max(240, Math.min(window.innerWidth - 20, (window.innerHeight - 170) * 0.75, 640));
    document.documentElement.style.setProperty('--gw', gw + 'px');
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    scale = gw / W;
    cv.width = Math.round(gw * dpr); cv.height = Math.round(gw * 4/3 * dpr);
    buildSprites();
  }
  function buildSprites(){
    sprites = F.map((f,i)=>{
      if(!f) return null;
      const k = scale * dpr, s = Math.ceil(f.r * 2 * k) + 4, o = document.createElement('canvas');
      o.width = o.height = s;
      const g = o.getContext('2d'), c = s/2, R = f.r * k;
      const grad = g.createRadialGradient(c - R*.35, c - R*.4, R*.1, c, c, R);
      grad.addColorStop(0,'#ffffff'); grad.addColorStop(.35, f.c); grad.addColorStop(1, shade(f.c,-18));
      g.fillStyle = grad; g.beginPath(); g.arc(c,c,R,0,Math.PI*2); g.fill();
      g.lineWidth = Math.max(1.5, R*.05); g.strokeStyle = shade(f.c,-30); g.stroke();
      g.font = Math.round(R*1.3) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(f.e, c, c + R*.08);
      return o;
    });
  }
  function shade(hex, amt){
    const n = parseInt(hex.slice(1),16);
    const r = Math.max(0,Math.min(255,(n>>16)+amt)), gg = Math.max(0,Math.min(255,((n>>8)&255)+amt)), b = Math.max(0,Math.min(255,(n&255)+amt));
    return 'rgb('+r+','+gg+','+b+')';
  }
  window.addEventListener('resize', resize);
  resize();

  let engine, score, cur, nxt, aimX = W/2, ready, dangerT, dead, merges, particles, lastDrop;

  function randLevel(){
    const r = Math.random();
    return r < .32 ? 1 : r < .58 ? 2 : r < .80 ? 3 : r < .94 ? 4 : 5;
  }

  function newGame(){
    engine = Engine.create();
    engine.gravity.y = 1.15;
    const opts = {isStatic:true, friction:.4, restitution:.1};
    Composite.add(engine.world, [
      Bodies.rectangle(W/2, H + WALL/2 - 8, W + WALL*2, WALL, opts),
      Bodies.rectangle(-WALL/2 + 8, H/2, WALL, H*2, opts),
      Bodies.rectangle(W + WALL/2 - 8, H/2, WALL, H*2, opts)
    ]);
    Events.on(engine, 'collisionStart', onPairs);
    Events.on(engine, 'collisionActive', onPairs);
    score = 0; dangerT = 0; dead = false; merges = []; particles = []; ready = true; lastDrop = 0;
    cur = randLevel(); nxt = randLevel();
    over.classList.remove('show');
    updateUI();
  }

  function onPairs(e){
    for(const p of e.pairs){
      const a = p.bodyA, b = p.bodyB;
      if(a.lvl && b.lvl && a.lvl === b.lvl && !a.gone && !b.gone){
        a.gone = b.gone = true; merges.push([a,b]);
      }
    }
  }

  function addFlower(lvl, x, y, now){
    const f = F[lvl];
    const body = Bodies.circle(x, y, f.r, {restitution:.12, friction:.35, frictionStatic:.5, frictionAir:.004, density:.0012});
    body.lvl = lvl; body.born = now; body.grow = 0;
    Composite.add(engine.world, body);
    return body;
  }

  function drop(){
    if(!ready || dead) return;
    const now = performance.now();
    const r = F[cur].r;
    const x = Math.max(r + 8, Math.min(W - r - 8, aimX));
    addFlower(cur, x, HOLD_Y, now);
    cur = nxt; nxt = randLevel();
    ready = false; lastDrop = now;
    updateUI();
  }

  function processMerges(now){
    for(const [a,b] of merges){
      Composite.remove(engine.world, a); Composite.remove(engine.world, b);
      const x = (a.position.x + b.position.x)/2, y = (a.position.y + b.position.y)/2;
      const lvl = a.lvl;
      burst(x, y, F[lvl].c, lvl);
      if(lvl < MAX){
        const n = addFlower(lvl+1, x, y, now);
        n.born = now - 1000; // merged flowers count as settled sooner
        n.grow = 1;
        Body.setVelocity(n, {x:(a.velocity.x+b.velocity.x)/2, y:(a.velocity.y+b.velocity.y)/2 - 1});
        score += POINTS[lvl+1];
        if(lvl+1 > seen){ seen = lvl+1; save('petal-seen', seen); }
      } else {
        score += 150; // two trees: a whole forest!
      }
    }
    if(merges.length) updateUI();
    merges = [];
  }

  function burst(x,y,color,lvl){
    const n = 8 + lvl*2;
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = 2 + Math.random()*4 + lvl*.3;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s - 1,life:1,col:color,rot:Math.random()*6,sz:5+Math.random()*6});
    }
  }

  function updateUI(){
    scoreEl.textContent = score;
    if(score > best){ best = score; save('petal-best', best); }
    bestEl.textContent = best;
    nextEl.textContent = F[nxt].e;
    let h=''; for(let i=1;i<=MAX;i++) h += '<div class="'+(i<=seen?'seen':'')+'">'+(i<=seen?F[i].e:'❔')+'</div>';
    ladderEl.innerHTML = h;
  }

  function gameOver(){
    dead = true;
    document.getElementById('ovText').textContent = 'Score: ' + score + (score >= best && score > 0 ? '  ·  New best! 🎉' : '');
    over.classList.add('show');
  }

  // Input
  function toWorld(clientX){
    const r = cv.getBoundingClientRect();
    return (clientX - r.left) / r.width * W;
  }
  let down = false;
  document.addEventListener('pointerdown', e=>{ if(e.target.closest('button')) return; down = true; aimX = toWorld(e.clientX); });
  document.addEventListener('pointermove', e=>{ if(down || e.pointerType === 'mouse') aimX = toWorld(e.clientX); });
  document.addEventListener('pointerup', e=>{ if(!down) return; down = false; aimX = toWorld(e.clientX); drop(); });
  document.addEventListener('pointercancel', ()=>{ down = false; });
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft') aimX -= 20; else if(e.key==='ArrowRight') aimX += 20;
    else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); drop(); }
  });
  document.getElementById('again').onclick = newGame;

  // Loop
  const STEP = 1000/60; let acc = 0, last = performance.now();
  function frame(now){
    let dt = Math.min(100, now - last); last = now;
    if(!dead){
      acc += dt;
      while(acc >= STEP){ Engine.update(engine, STEP); processMerges(now); acc -= STEP; }
      if(!ready && now - lastDrop > 550) ready = true;

      // danger check
      let danger = false;
      for(const b of Composite.allBodies(engine.world)){
        if(!b.lvl || b.gone) continue;
        if(now - b.born > 1600 && b.position.y - F[b.lvl].r < LINE) danger = true;
      }
      dangerT = danger ? dangerT + dt : Math.max(0, dangerT - dt*2);
      if(dangerT > 2200) gameOver();
    }
    // particles
    for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=.15; p.vx*=.97; p.life-=.022; p.rot+=.15; }
    particles = particles.filter(p=>p.life>0);
    draw(now);
    requestAnimationFrame(frame);
  }

  function petal(x,y,sz,rot,col,alpha){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha = alpha;
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0,0,sz,sz*.55,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function draw(now){
    const k = scale * dpr;
    ctx.setTransform(k,0,0,k,0,0);
    ctx.clearRect(0,0,W,H);
    // jar
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#fffafc'); g.addColorStop(1,'#f3e6ea');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#e9d6dd'; ctx.fillRect(0,0,8,H); ctx.fillRect(W-8,0,8,H); ctx.fillRect(0,H-8,W,8);

    // danger line
    const warn = dangerT > 0;
    ctx.save();
    ctx.setLineDash([14,12]); ctx.lineWidth = 3;
    ctx.strokeStyle = warn ? 'rgba(220,60,90,'+(0.5+0.5*Math.sin(now/90))+')' : 'rgba(180,140,155,.45)';
    ctx.beginPath(); ctx.moveTo(10,LINE); ctx.lineTo(W-10,LINE); ctx.stroke();
    ctx.restore();

    // aim guide + held flower
    if(!dead){
      const r = F[cur].r, x = Math.max(r + 8, Math.min(W - r - 8, aimX));
      ctx.save(); ctx.strokeStyle='rgba(200,150,170,.35)'; ctx.lineWidth=2; ctx.setLineDash([4,10]);
      ctx.beginPath(); ctx.moveTo(x, HOLD_Y + r); ctx.lineTo(x, H-8); ctx.stroke(); ctx.restore();
      ctx.globalAlpha = ready ? 1 : .35;
      ctx.drawImage(sprites[cur], x - r - 2/k, HOLD_Y - r - 2/k, r*2 + 4/k, r*2 + 4/k);
      ctx.globalAlpha = 1;
    }

    // flowers
    for(const b of Composite.allBodies(engine.world)){
      if(!b.lvl) continue;
      const r = F[b.lvl].r;
      let s = 1;
      if(b.grow > 0){ b.grow = Math.max(0, b.grow - .08); s = 1 - b.grow*.35 + Math.sin(b.grow*Math.PI)*.15; }
      ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle); ctx.scale(s,s);
      ctx.drawImage(sprites[b.lvl], -r - 2/k, -r - 2/k, r*2 + 4/k, r*2 + 4/k);
      ctx.restore();
    }

    for(const p of particles) petal(p.x,p.y,p.sz,p.rot,p.col,Math.max(0,p.life));
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
